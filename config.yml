# agents-radar configuration
# Edit this file to customize the news sources. Changes take effect on the
# next workflow run. Built-in defaults (see src/config.ts) are used when this
# section is missing.
#
# Order matters: earlier sources win when the same story is reported by
# several outlets. Set `enabled: false` to pause a source without deleting it.
#
# Roundup entries (早报/晨报/周报 and leiphone /zaobao/ links) are filtered out
# automatically — they link to a list of headlines, not an article body.

news_sources:
  - id: qbitai
    name: 量子位
    url: https://www.qbitai.com/feed
  - id: leiphone
    name: 雷峰网
    url: https://www.leiphone.com/feed
  - id: tmtpost
    name: 钛媒体
    url: https://www.tmtpost.com/feed
  - id: ifanr
    name: 爱范儿
    url: https://www.ifanr.com/feed
  - id: oschina
    name: 开源中国
    url: https://www.oschina.net/news/rss
  - id: sspai
    name: 少数派
    url: https://sspai.com/feed
  - id: appinn
    name: 小众软件
    url: https://www.appinn.com/feed/
